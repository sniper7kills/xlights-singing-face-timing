# FR-foundation-10: lint, typecheck, unit tests, build and E2E tests run on each pull request to main.
name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The commit SHA pins each action, because a tag can move to different code.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # --with-deps installs the system libraries that Chromium needs on the runner.
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      # This step has no fallback, so a browser that cannot start fails the workflow.
      - name: E2E tests
        id: e2e
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ failure() && steps.e2e.conclusion == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
