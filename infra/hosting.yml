# FR-foundation-12: the hosting stack for the app. Create the stack in us-east-1.
# The deploy workflow, .github/workflows/deploy.yml, reads the outputs through repository variables.
AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 bucket behind CloudFront, and the GitHub OIDC deploy role.

Parameters:
  GitHubRepository:
    Type: String
    Description: The GitHub repository that deploys to this stack, as owner/name.
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
    ConstraintDescription: Use the form owner/name.
  GitHubSubjectPrefix:
    Type: String
    Description: >-
      The start of the subject claim of the GitHub OIDC token, without the ref. A repository with
      immutable subject claims uses the form repo:owner@id/name@id. Read it with
      gh api repos/OWNER/NAME/actions/oidc/customization/sub. Leave it empty for the form repo:owner/name.
    AllowedPattern: '^$|^repo:[A-Za-z0-9_.@/-]+$'
    Default: ''
  CreateGitHubOidcProvider:
    Type: String
    Description: >-
      Set to true only if the account has no IAM OIDC provider for
      token.actions.githubusercontent.com. An account can hold one provider for each URL.
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'

Conditions:
  CreateOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, 'true']
  DefaultSubjectPrefix: !Equals [!Ref GitHubSubjectPrefix, '']

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      # FR-foundation-17: only CloudFront reads the bucket.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # An origin access control needs ACLs off on the bucket.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site'
        Description: CloudFront signs each request to the site bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowReadFromThisDistributionOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'
          - Sid: DenyRequestsWithoutTls
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # FR-foundation-15: CloudFront adds these headers to every response.
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        Comment: The security headers from docs/specs/features/00-foundation.md.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'"
            Override: true
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
        # The two headers make the page cross-origin isolated, so the speech model uses more than one CPU thread.
        # Each cross-origin resource then needs CORS or Cross-Origin-Resource-Policy. See docs/adr/0006.
        CustomHeadersConfig:
          Items:
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true
            - Header: Cross-Origin-Embedder-Policy
              Value: require-corp
              Override: true

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Singing face timing app (${AWS::StackName})'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            # An origin access control replaces the origin access identity, so the value is empty.
            S3OriginConfig:
              OriginAccessIdentity: ''
        # The app uses hash routes, so the distribution has no rewrite rule and no custom error response.
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          # CloudFront serves content over HTTPS only, and sends an http:// request to the HTTPS URL.
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          Compress: true
          # Managed policy CachingOptimized. It keeps the Cache-Control value that the deploy sets on each file.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # FR-foundation-18: the deploy workflow assumes this role through GitHub OIDC and holds no access key.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'The deploy workflow of ${GitHubRepository} on main assumes this role.'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !GetAtt GitHubOidcProvider.Arn
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !If
                  - DefaultSubjectPrefix
                  - !Sub 'repo:${GitHubRepository}:ref:refs/heads/main'
                  - !Sub '${GitHubSubjectPrefix}:ref:refs/heads/main'
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # aws s3 sync lists the bucket to find the files to upload and to delete.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

Outputs:
  SiteBucketName:
    Description: The value for the repository variable SITE_BUCKET.
    Value: !Ref SiteBucket
  DistributionId:
    Description: The value for the repository variable CLOUDFRONT_DISTRIBUTION_ID.
    Value: !Ref SiteDistribution
  DistributionDomainName:
    Description: The production URL, without https://.
    Value: !GetAtt SiteDistribution.DomainName
  DeployRoleArn:
    Description: The value for the repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
